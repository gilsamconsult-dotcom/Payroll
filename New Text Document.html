<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kenya Payroll System</title>
<style>
  :root {
    --navy:    #0B1F3A;
    --blue:    #1A56DB;
    --blue-lt: #EBF5FF;
    --teal:    #0694A2;
    --teal-lt: #E6FFFA;
    --green:   #057A55;
    --green-lt:#F3FAF7;
    --amber:   #C27803;
    --amber-lt:#FFFBEB;
    --red:     #C81E1E;
    --red-lt:  #FDF2F2;
    --gray-50: #F9FAFB;
    --gray-100:#F3F4F6;
    --gray-200:#E5E7EB;
    --gray-300:#D1D5DB;
    --gray-400:#9CA3AF;
    --gray-500:#6B7280;
    --gray-700:#374151;
    --gray-900:#111827;
    --white:   #FFFFFF;
    --sidebar-w: 240px;
    --radius:  8px;
    --shadow:  0 1px 3px rgba(0,0,0,.10), 0 1px 2px rgba(0,0,0,.06);
    --shadow-lg:0 4px 16px rgba(0,0,0,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--gray-50);color:var(--gray-900);font-size:14px;line-height:1.5}
  button{cursor:pointer;font-family:inherit}
  input,select,textarea{font-family:inherit}

  /* ── Layout ── */
  #app{display:flex;min-height:100vh}
  .sidebar{width:var(--sidebar-w);background:var(--navy);color:#fff;display:flex;flex-direction:column;flex-shrink:0;position:fixed;top:0;left:0;height:100vh;overflow-y:auto;z-index:100}
  .main{margin-left:var(--sidebar-w);flex:1;display:flex;flex-direction:column;min-height:100vh}
  .topbar{background:var(--white);border-bottom:1px solid var(--gray-200);padding:0 24px;height:60px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50}
  .content{padding:24px;flex:1}

  /* ── Sidebar ── */
  .sidebar-logo{padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
  .sidebar-logo .logo-mark{font-size:20px;font-weight:800;letter-spacing:-0.5px;color:#fff}
  .sidebar-logo .logo-sub{font-size:10px;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:1px;margin-top:2px}
  .sidebar-company{padding:12px 16px;border-bottom:1px solid rgba(255,255,255,.1)}
  .sidebar-company .company-name{font-size:12px;font-weight:600;color:rgba(255,255,255,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .sidebar-company .company-period{font-size:11px;color:rgba(255,255,255,.5)}
  .sidebar-nav{flex:1;padding:8px 0}
  .nav-section{padding:16px 16px 4px;font-size:10px;font-weight:700;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:1px}
  .nav-item{display:flex;align-items:center;gap:10px;padding:9px 16px;font-size:13px;color:rgba(255,255,255,.7);cursor:pointer;border-left:3px solid transparent;transition:all .15s}
  .nav-item:hover{background:rgba(255,255,255,.08);color:#fff}
  .nav-item.active{background:rgba(26,86,219,.25);color:#fff;border-left-color:var(--blue);font-weight:600}
  .nav-item .icon{width:18px;text-align:center;flex-shrink:0;opacity:.8}
  .sidebar-footer{padding:16px;border-top:1px solid rgba(255,255,255,.1)}
  .sidebar-footer .user-name{font-size:12px;font-weight:600;color:rgba(255,255,255,.9)}
  .sidebar-footer .user-role{font-size:11px;color:rgba(255,255,255,.4)}

  /* ── Cards ── */
  .card{background:var(--white);border-radius:var(--radius);border:1px solid var(--gray-200);box-shadow:var(--shadow)}
  .card-header{padding:16px 20px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between;gap:12px}
  .card-title{font-size:15px;font-weight:700;color:var(--gray-900)}
  .card-body{padding:20px}
  .card-body.p-0{padding:0}

  /* ── KPI Stats ── */
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
  .stat-card{background:var(--white);border-radius:var(--radius);border:1px solid var(--gray-200);padding:18px 20px;display:flex;align-items:flex-start;gap:14px}
  .stat-icon{width:44px;height:44px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
  .stat-icon.blue{background:var(--blue-lt)}
  .stat-icon.green{background:var(--green-lt)}
  .stat-icon.amber{background:var(--amber-lt)}
  .stat-icon.red{background:var(--red-lt)}
  .stat-icon.teal{background:var(--teal-lt)}
  .stat-label{font-size:12px;color:var(--gray-500);margin-bottom:4px}
  .stat-value{font-size:22px;font-weight:800;color:var(--gray-900)}
  .stat-sub{font-size:11px;color:var(--gray-400);margin-top:2px}

  /* ── Tables ── */
  .table-wrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  thead th{padding:10px 14px;text-align:left;font-size:11px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.5px;background:var(--gray-50);border-bottom:1px solid var(--gray-200)}
  thead th:last-child{text-align:right}
  tbody td{padding:12px 14px;border-bottom:1px solid var(--gray-100);font-size:13px}
  tbody td:last-child{text-align:right}
  tbody tr:hover{background:var(--gray-50)}
  tbody tr:last-child td{border-bottom:none}
  .tfoot-row td{padding:10px 14px;font-weight:700;background:var(--gray-50);font-size:13px;border-top:2px solid var(--gray-200)}

  /* ── Badges ── */
  .badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600}
  .badge.green{background:var(--green-lt);color:var(--green)}
  .badge.amber{background:var(--amber-lt);color:var(--amber)}
  .badge.red{background:var(--red-lt);color:var(--red)}
  .badge.blue{background:var(--blue-lt);color:var(--blue)}
  .badge.gray{background:var(--gray-100);color:var(--gray-500)}

  /* ── Buttons ── */
  .btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:6px;font-size:13px;font-weight:600;border:none;transition:all .15s}
  .btn-primary{background:var(--blue);color:#fff}.btn-primary:hover{background:#1447C0}
  .btn-success{background:var(--green);color:#fff}.btn-success:hover{background:#045F42}
  .btn-danger{background:var(--red);color:#fff}.btn-danger:hover{background:#A01818}
  .btn-outline{background:#fff;color:var(--gray-700);border:1px solid var(--gray-300)}.btn-outline:hover{background:var(--gray-50)}
  .btn-teal{background:var(--teal);color:#fff}.btn-teal:hover{background:#05707A}
  .btn-amber{background:var(--amber);color:#fff}.btn-amber:hover{background:#9A6002}
  .btn-sm{padding:5px 12px;font-size:12px}
  .btn-xs{padding:3px 8px;font-size:11px}
  .btn-group{display:flex;gap:8px;flex-wrap:wrap}

  /* ── Forms ── */
  .form-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
  .form-group{display:flex;flex-direction:column;gap:5px}
  .form-group label{font-size:12px;font-weight:600;color:var(--gray-700)}
  .form-control{padding:8px 12px;border:1px solid var(--gray-300);border-radius:6px;font-size:13px;color:var(--gray-900);background:var(--white);outline:none;transition:border-color .15s}
  .form-control:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(26,86,219,.1)}
  .form-control:disabled{background:var(--gray-100);color:var(--gray-500)}
  select.form-control{cursor:pointer}

  /* ── Tabs ── */
  .tabs{display:flex;gap:0;border-bottom:2px solid var(--gray-200);margin-bottom:20px}
  .tab{padding:10px 18px;font-size:13px;font-weight:600;color:var(--gray-500);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .15s}
  .tab:hover{color:var(--gray-900)}
  .tab.active{color:var(--blue);border-bottom-color:var(--blue)}

  /* ── Modals ── */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
  .modal{background:var(--white);border-radius:12px;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow-lg)}
  .modal-header{padding:20px 24px 16px;border-bottom:1px solid var(--gray-200);display:flex;align-items:center;justify-content:space-between}
  .modal-title{font-size:17px;font-weight:700}
  .modal-body{padding:24px}
  .modal-footer{padding:16px 24px;border-top:1px solid var(--gray-200);display:flex;justify-content:flex-end;gap:10px}
  .modal-close{background:none;border:none;font-size:20px;color:var(--gray-400);cursor:pointer;padding:0 4px}
  .modal-close:hover{color:var(--gray-700)}

  /* ── Alert ── */
  .alert{padding:12px 16px;border-radius:6px;font-size:13px;display:flex;align-items:flex-start;gap:10px;margin-bottom:16px}
  .alert.info{background:var(--blue-lt);color:var(--blue)}
  .alert.success{background:var(--green-lt);color:var(--green)}
  .alert.warning{background:var(--amber-lt);color:var(--amber)}
  .alert.danger{background:var(--red-lt);color:var(--red)}

  /* ── Page header ── */
  .page-header{margin-bottom:20px}
  .page-title{font-size:20px;font-weight:800;color:var(--gray-900)}
  .page-sub{font-size:13px;color:var(--gray-500);margin-top:3px}
  .page-actions{display:flex;gap:8px;align-items:center}
  .page-header-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap}

  /* ── Payslip ── */
  .payslip{border:1px solid var(--gray-200);border-radius:var(--radius);padding:24px;background:#fff;max-width:680px}
  .payslip-header{border-bottom:2px solid var(--navy);padding-bottom:16px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-start}
  .payslip-company{font-size:18px;font-weight:800;color:var(--navy)}
  .payslip-period{font-size:12px;color:var(--gray-500)}
  .payslip-employee{background:var(--gray-50);border-radius:6px;padding:12px 16px;margin-bottom:20px;display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .payslip-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:8px 0;border-bottom:1px solid var(--gray-100)}
  .payslip-row:last-child{border-bottom:none}
  .payslip-section{font-size:12px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--gray-200)}
  .payslip-net{background:var(--navy);color:#fff;border-radius:6px;padding:14px 16px;margin-top:20px;display:flex;justify-content:space-between;align-items:center;font-size:16px;font-weight:800}

  /* ── P10 ── */
  .p10-preview{overflow-x:auto;font-size:11px}
  .p10-table{border-collapse:collapse;min-width:800px}
  .p10-table th,.p10-table td{border:1px solid #ccc;padding:4px 6px;white-space:nowrap}
  .p10-table th{background:#1A56DB;color:#fff;font-weight:700;font-size:10px}
  .p10-table tr:nth-child(even) td{background:#F3F4F6}

  /* ── Charts ── */
  .chart-bar-container{display:flex;align-items:flex-end;gap:8px;height:180px;padding:0 8px}
  .chart-bar-group{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1}
  .chart-bars{display:flex;align-items:flex-end;gap:3px;height:150px}
  .chart-bar{flex:1;border-radius:4px 4px 0 0;min-width:12px;transition:opacity .2s;cursor:pointer}
  .chart-bar:hover{opacity:.8}
  .chart-label{font-size:10px;color:var(--gray-400);text-align:center}
  .chart-legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
  .legend-item{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--gray-600)}
  .legend-dot{width:10px;height:10px;border-radius:2px;flex-shrink:0}

  /* ── Tags input ── */
  .tags-container{display:flex;flex-wrap:wrap;gap:6px;padding:6px;border:1px solid var(--gray-300);border-radius:6px;min-height:40px;cursor:text}
  .tag{background:var(--blue-lt);color:var(--blue);border-radius:4px;padding:2px 8px;font-size:12px;font-weight:600;display:flex;align-items:center;gap:4px}
  .tag-remove{cursor:pointer;opacity:.6}.tag-remove:hover{opacity:1}

  /* ── Responsive ── */
  @media(max-width:768px){
    .sidebar{transform:translateX(-100%)}
    .main{margin-left:0}
    .form-grid,.form-grid-3{grid-template-columns:1fr}
    .stats-grid{grid-template-columns:1fr 1fr}
  }

  /* ── Misc ── */
  .divider{border:none;border-top:1px solid var(--gray-200);margin:20px 0}
  .text-right{text-align:right}
  .text-center{text-align:center}
  .font-mono{font-family:'Courier New',monospace}
  .mt-16{margin-top:16px}
  .mb-16{margin-bottom:16px}
  .text-muted{color:var(--gray-400)}
  .fw-700{font-weight:700}
  .section-gap{display:flex;flex-direction:column;gap:20px}
  .hidden{display:none}
  .info-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .info-item label{font-size:11px;color:var(--gray-400);display:block}
  .info-item span{font-size:13px;font-weight:600;color:var(--gray-800)}
  .toast{position:fixed;bottom:24px;right:24px;z-index:999;background:var(--gray-900);color:#fff;padding:12px 20px;border-radius:8px;font-size:13px;font-weight:600;box-shadow:var(--shadow-lg);animation:slideUp .3s ease}
  @keyframes slideUp{from{transform:translateY(20px);opacity:0}to{transform:translateY(0);opacity:1}}
  .empty-state{text-align:center;padding:48px 20px;color:var(--gray-400)}
  .empty-state .icon{font-size:40px;margin-bottom:12px}
  .empty-state p{font-size:14px}
  .input-prefix{display:flex;border:1px solid var(--gray-300);border-radius:6px;overflow:hidden}
  .input-prefix span{background:var(--gray-100);padding:8px 12px;font-size:13px;color:var(--gray-500);border-right:1px solid var(--gray-300)}
  .input-prefix input{flex:1;border:none;padding:8px 12px;font-size:13px;outline:none}
  .two-cols{display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .three-cols{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px}
  @media(max-width:600px){.two-cols,.three-cols{grid-template-columns:1fr}}
</style>
</head>

<script type="text/javascript">
// ══════════════════════════════════════════════════════════
// KENYA PAYROLL SYSTEM — Full Application
// ══════════════════════════════════════════════════════════

// ── Kenya Tax Rates 2024/2025 ──────────────────────────────
const TAX_BANDS = [
  { limit: 24000,   rate: 0.10 },
  { limit: 8333,    rate: 0.25 },
  { limit: 467667,  rate: 0.30 },
  { limit: 300000,  rate: 0.325 },
  { limit: Infinity,rate: 0.35 },
];
const PERSONAL_RELIEF    = 2400;
const NSSF_TIER1_LIMIT   = 6000;
const NSSF_TIER2_LIMIT   = 12000;
const NSSF_RATE          = 0.06;
const SHIF_RATE          = 0.0275;
const AHL_RATE           = 0.015;

// ── PAYE Calculation ──────────────────────────────────────
function calcPAYE(grossTaxable, empType = 'primary') {
  if (empType === 'secondary') {
    return grossTaxable * 0.30;
  }
  let tax = 0, remaining = grossTaxable;
  for (const band of TAX_BANDS) {
    if (remaining <= 0) break;
    const taxable = Math.min(remaining, band.limit);
    tax += taxable * band.rate;
    remaining -= taxable;
  }
  return Math.max(0, tax - PERSONAL_RELIEF);
}

// ── NSSF Calculation (Tier I + II) ────────────────────────
function calcNSSF(basicSalary) {
  const tier1 = Math.min(basicSalary, NSSF_TIER1_LIMIT) * NSSF_RATE;
  const tier2 = basicSalary > NSSF_TIER1_LIMIT
    ? Math.min(basicSalary - NSSF_TIER1_LIMIT, NSSF_TIER2_LIMIT - NSSF_TIER1_LIMIT) * NSSF_RATE
    : 0;
  return { tier1, tier2, total: tier1 + tier2 };
}

// ── SHIF (Social Health Insurance Fund) ───────────────────
function calcSHIF(grossSalary, empType = 'primary') {
  if (empType === 'secondary') return 0;
  return Math.max(300, grossSalary * SHIF_RATE);
}

// ── AHL (Affordable Housing Levy) ─────────────────────────
function calcAHL(grossSalary, empType = 'primary') {
  if (empType === 'secondary') return 0;
  return grossSalary * AHL_RATE;
}

// ── Full Payroll Computation ───────────────────────────────
function computePayroll(employee, month, year) {
  const basic   = employee.basicSalary;
  const empType = employee.empType || 'primary';

  // Sum all allowances
  const allowances = (employee.allowances || []).reduce((s, a) => s + (a.amount || 0), 0);
  const grossSalary = basic + allowances;

  // Statutory deductions
  const nssf = calcNSSF(basic);
  const shif = calcSHIF(grossSalary, empType);
  const ahl  = calcAHL(grossSalary, empType);

  // Taxable income = Gross − NSSF (employee)
  const taxableIncome = grossSalary - nssf.total;
  const paye = calcPAYE(taxableIncome, empType);

  // Other deductions
  const otherDeductions = (employee.deductions || []).reduce((s, d) => s + (d.amount || 0), 0);

  const totalDeductions = nssf.total + shif + ahl + paye + otherDeductions;
  const netPay = grossSalary - totalDeductions;

  return {
    employeeId: employee.id,
    employeeName: `${employee.firstName} ${employee.lastName}`,
    kraPin: employee.kraPin || '',
    idNumber: employee.idNumber || '',
    basicSalary: basic,
    allowances,
    grossSalary,
    nssfTier1: nssf.tier1,
    nssfTier2: nssf.tier2,
    nssf: nssf.total,
    shif,
    ahl,
    paye,
    taxableIncome,
    otherDeductions,
    totalDeductions,
    netPay,
    empType,
    month, year
  };
}

// ── State Management ───────────────────────────────────────
let state = {
  page: 'dashboard',
  modal: null,
  company: {

    kraPin: 'P051234567A',

  },

  employees: [

    { id:'E002', firstName:'Faith', lastName:'Wanjiru', idNumber:'23456789', kraPin:'A002345678X', nssfNo:'2000002', department:'HR', designation:'HR Manager', basicSalary:120000, empType:'primary', email:'faith@co.ke', phone:'0733000002', status:'active', dateHired:'2021-06-15', allowances:[{name:'House Allowance',amount:25000},{name:'Transport',amount:8000},{name:'Medical',amount:5000}], deductions:[] },
    { id:'E003', firstName:'David', lastName:'Ochieng', idNumber:'34567890', kraPin:'A003456789Y', nssfNo:'2000003', department:'IT', designation:'Software Engineer', basicSalary:95000, empType:'primary', email:'david@co.ke', phone:'0744000003', status:'active', dateHired:'2023-03-01', allowances:[{name:'House Allowance',amount:20000},{name:'Airtime',amount:2000}], deductions:[{name:'Salary Advance',amount:10000}] },
    { id:'E004', firstName:'Mary', lastName:'Atieno', idNumber:'45678901', kraPin:'A004567890Z', nssfNo:'2000004', department:'Sales', designation:'Sales Executive', basicSalary:55000, empType:'primary', email:'mary@co.ke', phone:'0755000004', status:'active', dateHired:'2023-09-01', allowances:[{name:'Commute',amount:4000},{name:'Commission',amount:12000}], deductions:[] },
    { id:'E005', firstName:'Peter', lastName:'Mwangi', idNumber:'56789012', kraPin:'A005678901P', nssfNo:'2000005', department:'Operations', designation:'Operations Lead', basicSalary:70000, empType:'secondary', email:'peter@co.ke', phone:'0766000005', status:'active', dateHired:'2024-01-15', allowances:[{name:'Transport',amount:6000}], deductions:[] },
  ],
  payrollRuns: [],
  loans: [
    { id:'L001', employeeId:'E001', employeeName:'James Kamau', loanType:'Salary Advance', amount:50000, balance:50000, monthlyRepayment:2500, startMonth:7, startYear:2025, status:'active' },
    { id:'L002', employeeId:'E003', employeeName:'David Ochieng', loanType:'Emergency Loan', amount:30000, balance:30000, monthlyRepayment:10000, startMonth:7, startYear:2025, status:'active' },
  ],
  activeTab: 0,
  editEmployee: null,
  viewPayslip: null,
  toast: null,
};

const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DEPARTMENTS = ['Finance','HR','IT','Sales','Operations','Management','Legal','Marketing'];

// ── Toast ──────────────────────────────────────────────────
function showToast(msg) {
  state.toast = msg;
  render();
  setTimeout(() => { state.toast = null; render(); }, 3000);
}

// ── Helpers ────────────────────────────────────────────────
const fmt = n => 'Kshs ' + (n||0).toLocaleString('en-KE', {minimumFractionDigits:2, maximumFractionDigits:2});
const fmtN = n => (n||0).toLocaleString('en-KE', {minimumFractionDigits:2, maximumFractionDigits:2});
const monthYear = (m,y) => `${MONTHS[m-1]} ${y}`;
const uid = () => 'ID'+Date.now().toString(36).toUpperCase();

function getPayrollForPeriod(month, year) {
  return state.employees
    .filter(e => e.status === 'active')
    .map(e => computePayroll(e, month, year));
}

function currentPayroll() {
  return getPayrollForPeriod(state.currentPeriod.month, state.currentPeriod.year);
}

function renderTopbar() {

      <select class="form-control" style="width:auto;font-size:12px" onchange="changePeriod(this.value)">
        ${Array.from({length:12},(_,i)=>{
          const m=i+1,y=2025;
          const val=`${m}-${y}`;

// ── Dashboard ──────────────────────────────────────────────
function renderDashboard() {
  const pr = currentPayroll();
  const totalGross = pr.reduce((s,r)=>s+r.grossSalary,0);
  const totalNet   = pr.reduce((s,r)=>s+r.netPay,0);
  const totalPAYE  = pr.reduce((s,r)=>s+r.paye,0);
  const totalNSSF  = pr.reduce((s,r)=>s+r.nssf,0);
  const totalSHIF  = pr.reduce((s,r)=>s+r.shif,0);
  const totalAHL   = pr.reduce((s,r)=>s+r.ahl,0);
  const activeEmps = state.employees.filter(e=>e.status==='active').length;

  // Build chart data for last 6 months
  const chartMonths = [];
  for (let i=5;i>=0;i--) {
    let m = state.currentPeriod.month - i;
    let y = state.currentPeriod.year;
    if (m<=0){m+=12;y--;}
    const pr2 = getPayrollForPeriod(m,y);
    chartMonths.push({
      label: MONTHS[m-1].slice(0,3),
      gross: pr2.reduce((s,r)=>s+r.grossSalary,0),
      net:   pr2.reduce((s,r)=>s+r.netPay,0),
      paye:  pr2.reduce((s,r)=>s+r.paye,0),
    });
  }
  const maxVal = Math.max(...chartMonths.map(c=>c.gross),1);

  return `
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-icon blue">👥</div>
      <div>
        <div class="stat-label">Active Employees</div>
        <div class="stat-value">${activeEmps}</div>
        <div class="stat-sub">Permanent staff</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon green">💰</div>
      <div>
        <div class="stat-label">Total Gross Pay</div>
        <div class="stat-value">${fmt(totalGross)}</div>
        <div class="stat-sub">${monthYear(state.currentPeriod.month,state.currentPeriod.year)}</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon teal">✅</div>
      <div>
        <div class="stat-label">Total Net Pay</div>
        <div class="stat-value">${fmt(totalNet)}</div>
        <div class="stat-sub">After all deductions</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon amber">🏛️</div>
      <div>
        <div class="stat-label">Total PAYE</div>
        <div class="stat-value">${fmt(totalPAYE)}</div>
        <div class="stat-sub">Due to KRA</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon blue">🛡️</div>
      <div>
        <div class="stat-label">Total NSSF</div>
        <div class="stat-value">${fmt(totalNSSF)}</div>
        <div class="stat-sub">Employee contribution</div>
      </div>
    </div>
    <div class="stat-card">
      <div class="stat-icon red">🏥</div>
      <div>
        <div class="stat-label">SHA/SHIF + AHL</div>
        <div class="stat-value">${fmt(totalSHIF+totalAHL)}</div>
        <div class="stat-sub">Health + Housing levy</div>
      </div>
    </div>
  </div>

  <div class="two-cols">
    <div class="card">
      <div class="card-header">
        <div class="card-title">📈 Payroll Trend — Last 6 Months</div>
      </div>
      <div class="card-body">
        <div class="chart-bar-container">
          ${chartMonths.map(c=>`
          <div class="chart-bar-group">
            <div class="chart-bars">
              <div class="chart-bar" style="background:var(--blue);height:${Math.round(c.gross/maxVal*140)}px" title="Gross: ${fmt(c.gross)}"></div>
              <div class="chart-bar" style="background:var(--green);height:${Math.round(c.net/maxVal*140)}px" title="Net: ${fmt(c.net)}"></div>
              <div class="chart-bar" style="background:var(--amber);height:${Math.round(c.paye/maxVal*140)}px" title="PAYE: ${fmt(c.paye)}"></div>
            </div>
            <div class="chart-label">${c.label}</div>
          </div>`).join('')}
        </div>
        <div class="chart-legend">
          <div class="legend-item"><div class="legend-dot" style="background:var(--blue)"></div>Gross</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--green)"></div>Net</div>
          <div class="legend-item"><div class="legend-dot" style="background:var(--amber)"></div>PAYE</div>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <div class="card-title">📊 Deduction Breakdown</div>
      </div>
      <div class="card-body">
        ${[
          ['PAYE (KRA)',totalPAYE,'var(--amber)'],
          ['NSSF',totalNSSF,'var(--blue)'],
          ['SHA/SHIF',totalSHIF,'var(--red)'],
          ['AHL',totalAHL,'var(--teal)'],
          ['Other Deductions',pr.reduce((s,r)=>s+r.otherDeductions,0),'var(--gray-400)'],
        ].map(([label,val,color])=>{
          const pct = totalGross?Math.round(val/totalGross*100):0;
          return `<div style="margin-bottom:14px">
            <div style="display:flex;justify-content:space-between;margin-bottom:4px">
              <span style="font-size:12px;font-weight:600;color:var(--gray-700)">${label}</span>
              <span style="font-size:12px;font-weight:700">${fmt(val)} <span class="text-muted">(${pct}%)</span></span>
            </div>
            <div style="background:var(--gray-100);border-radius:99px;height:8px">
              <div style="background:${color};height:8px;border-radius:99px;width:${pct}%"></div>
            </div>
          </div>`;
        }).join('')}
        <div style="border-top:1px solid var(--gray-200);padding-top:12px;margin-top:4px;display:flex;justify-content:space-between;font-weight:700">
          <span>Total Deductions</span><span>${fmt(pr.reduce((s,r)=>s+r.totalDeductions,0))}</span>
        </div>
      </div>
    </div>
  </div>

  <div class="card mt-16">
    <div class="card-header">
      <div class="card-title">📋 Employee Summary — ${monthYear(state.currentPeriod.month,state.currentPeriod.year)}</div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr>
          <th>Employee</th><th>Department</th><th>Gross Pay</th><th>PAYE</th><th>NSSF</th><th>SHIF</th><th>AHL</th><th>Net Pay</th>
        </tr></thead>
        <tbody>
          ${pr.map(r=>`<tr>
            <td><strong>${r.employeeName}</strong><br><span class="text-muted" style="font-size:11px">${r.kraPin}</span></td>
            <td>${state.employees.find(e=>e.id===r.employeeId)?.department||''}</td>
            <td>${fmt(r.grossSalary)}</td>
            <td>${fmt(r.paye)}</td>
            <td>${fmt(r.nssf)}</td>
            <td>${fmt(r.shif)}</td>
            <td>${fmt(r.ahl)}</td>
            <td><strong style="color:var(--green)">${fmt(r.netPay)}</strong></td>
          </tr>`).join('')}
        </tbody>
        <tfoot><tr class="tfoot-row">
          <td colspan="2">TOTAL</td>
          <td>${fmt(pr.reduce((s,r)=>s+r.grossSalary,0))}</td>
          <td>${fmt(pr.reduce((s,r)=>s+r.paye,0))}</td>
          <td>${fmt(pr.reduce((s,r)=>s+r.nssf,0))}</td>
          <td>${fmt(pr.reduce((s,r)=>s+r.shif,0))}</td>
          <td>${fmt(pr.reduce((s,r)=>s+r.ahl,0))}</td>
          <td><strong>${fmt(pr.reduce((s,r)=>s+r.netPay,0))}</strong></td>
        </tr></tfoot>
      </table>
    </div>
  </div>`;
}

// ── Payslips ───────────────────────────────────────────────
function renderPayslips() {
  const pr = currentPayroll();
  if (state.viewPayslip) {
    const r = pr.find(p=>p.employeeId===state.viewPayslip);
    const emp = state.employees.find(e=>e.id===state.viewPayslip);
    if (r && emp) return renderSinglePayslip(r, emp);
  }
  return `
  <div class="page-header-row">
    <div><div class="page-title">Payslips</div><div class="page-sub">${monthYear(state.currentPeriod.month,state.currentPeriod.year)}</div></div>
    <button class="btn btn-primary btn-sm" onclick="sendAllPayslips()">📧 Email All Payslips</button>
  </div>
  <div class="card">
    <div class="table-wrap">
      <table>
        <thead><tr><th>Employee</th><th>Department</th><th>Gross Pay</th><th>Net Pay</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody>
          ${pr.map(r=>{
            const emp=state.employees.find(e=>e.id===r.employeeId);
            return `<tr>
              <td><strong>${r.employeeName}</strong><br><span class="text-muted" style="font-size:11px">${r.employeeId}</span></td>
              <td>${emp?.department||''}</td>
              <td>${fmt(r.grossSalary)}</td>
              <td><strong style="color:var(--green)">${fmt(r.netPay)}</strong></td>
              <td><span class="badge green">Generated</span></td>
              <td>
                <div class="btn-group">
                  <button class="btn btn-outline btn-xs" onclick="viewPayslipPage('${r.employeeId}')">👁 View</button>
                  <button class="btn btn-outline btn-xs" onclick="downloadPayslipPDF('${r.employeeId}')">📄 PDF</button>
                  <button class="btn btn-outline btn-xs" onclick="emailPayslip('${r.employeeId}')">📧 Email</button>
                </div>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>
  </div>`;
}

function renderSinglePayslip(r, emp) {
  const period = monthYear(r.month, r.year);
  const allowances = emp.allowances || [];
  const deductions = emp.deductions || [];
  return `
  <div class="page-header-row" style="margin-bottom:16px">
    <div><div class="page-title">Payslip — ${r.employeeName}</div><div class="page-sub">${period}</div></div>
    <div class="btn-group">
      <button class="btn btn-outline btn-sm" onclick="state.viewPayslip=null;render()">← Back</button>
      <button class="btn btn-primary btn-sm" onclick="downloadPayslipPDF('${r.employeeId}')">📄 Download PDF</button>
      <button class="btn btn-outline btn-sm" onclick="emailPayslip('${r.employeeId}')">📧 Email</button>
    </div>
  </div>
  <div class="payslip">
    <div class="payslip-header">
      <div>
        <div class="payslip-company">${state.company.name}</div>
        <div class="payslip-period" style="font-size:11px;color:var(--gray-400);margin-top:4px">${state.company.address}</div>
      </div>
      <div style="text-align:right">
        <div style="font-size:20px;font-weight:800;color:var(--navy)">PAYSLIP</div>
        <div class="payslip-period">Period: ${period}</div>
      </div>
    </div>

    <div class="payslip-employee">
      ${[['Employee Name',r.employeeName],['Employee ID',r.employeeId],['Department',emp.department],['Designation',emp.designation],['KRA PIN',emp.kraPin],['NSSF No.',emp.nssfNo],['ID Number',emp.idNumber],['Employment Type',r.empType==='primary'?'Primary':'Secondary']].map(([l,v])=>`
      <div class="info-item"><label>${l}</label><span>${v||'—'}</span></div>`).join('')}
    </div>

    <div class="payslip-section">Earnings</div>
    <div class="payslip-row"><span>Basic Salary</span><span><strong>${fmt(r.basicSalary)}</strong></span></div>
    ${allowances.map(a=>`<div class="payslip-row"><span>${a.name}</span><span>${fmt(a.amount)}</span></div>`).join('')}
    <div class="payslip-row" style="font-weight:700"><span>GROSS PAY</span><span>${fmt(r.grossSalary)}</span></div>

    <div class="payslip-section">Statutory Deductions</div>
    <div class="payslip-row"><span>PAYE (Income Tax)</span><span style="color:var(--red)">(${fmt(r.paye)})</span></div>
    <div class="payslip-row"><span>NSSF — Tier I</span><span style="color:var(--red)">(${fmt(r.nssfTier1)})</span></div>
    <div class="payslip-row"><span>NSSF — Tier II</span><span style="color:var(--red)">(${fmt(r.nssfTier2)})</span></div>
    <div class="payslip-row"><span>SHA / SHIF (2.75%)</span><span style="color:var(--red)">(${fmt(r.shif)})</span></div>
    <div class="payslip-row"><span>Affordable Housing Levy (1.5%)</span><span style="color:var(--red)">(${fmt(r.ahl)})</span></div>
    ${r.empType==='secondary'?`<div class="alert warning" style="margin-top:8px;font-size:11px">⚠️ Secondary employment: PAYE @ 30% of gross. No SHIF, AHL, or personal relief applied.</div>`:''}

    ${deductions.length?`
    <div class="payslip-section">Other Deductions</div>
    ${deductions.map(d=>`<div class="payslip-row"><span>${d.name}</span><span style="color:var(--red)">(${fmt(d.amount)})</span></div>`).join('')}`:''}

    <div class="payslip-row" style="font-weight:700;margin-top:8px">
      <span>TOTAL DEDUCTIONS</span><span style="color:var(--red)">(${fmt(r.totalDeductions)})</span>
    </div>

    <div class="payslip-net">
      <span>NET PAY</span>
      <span>${fmt(r.netPay)}</span>
    </div>

    <div style="margin-top:20px;font-size:11px;color:var(--gray-400);text-align:center">
      This is a computer-generated payslip and does not require a signature.<br>
      Generated: ${new Date().toLocaleDateString('en-KE')} | ${state.company.name} | ${state.company.email}
    </div>

function renderP9Preview() {

  if (!empId) { preview.innerHTML=''; return; }
  const emp = state.employees.find(e=>e.id===empId);
  if (!emp) return;

  // Compute for all 12 months
  const rows = Array.from({length:12},(_,i)=>{
    const r = computePayroll(emp, i+1, state.currentPeriod.year);
    return r;
  });

  const totGross = rows.reduce((s,r)=>s+r.grossSalary,0);

    </div>
    <div class="card-body">
      <div class="form-grid-3">
        ${[['Employee Name',`${emp.firstName} ${emp.lastName}`],['Employee ID',emp.id],['KRA PIN',emp.kraPin],['ID Number',emp.idNumber],['Designation',emp.designation],['Tax Year',state.currentPeriod.year]].map(([l,v])=>`
        <div class="info-item"><label>${l}</label><span>${v||'—'}</span></div>`).join('')}
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Month</th><th>Basic Salary</th><th>Allowances</th><th>Gross Pay</th><th>NSSF</th><th>Taxable Pay</th><th>Tax on Income</th><th>Less: Relief</th><th>PAYE Payable</th></tr></thead>

function saveEmployee(id) {
  const fn = document.getElementById('emp_fname')?.value?.trim();
  const ln = document.getElementById('emp_lname')?.value?.trim();
  const basic = parseFloat(document.getElementById('emp_basic')?.value || 0);
  if (!fn || !ln || !basic) { showToast('❌ Please fill in required fields'); return; }

  // Collect allowances
  const allowances = [];
  document.querySelectorAll('[id^="allow_name_"]').forEach(el=>{
    const i = el.id.replace('allow_name_','');
    const name = el.value.trim();
    const amt = parseFloat(document.getElementById(`allow_amt_${i}`)?.value||0);
    if (name && amt) allowances.push({name,amount:amt});
  });

  // Collect deductions
  const deductions = [];
  document.querySelectorAll('[id^="ded_name_"]').forEach(el=>{
    const i = el.id.replace('ded_name_','');
    const name = el.value.trim();
    const amt = parseFloat(document.getElementById(`ded_amt_${i}`)?.value||0);
    if (name && amt) deductions.push({name,amount:amt});
  });

  const emp = {
    id: id || uid(),
    firstName: fn,
    lastName: ln,
    idNumber: document.getElementById('emp_id_num')?.value||'',
    kraPin: document.getElementById('emp_kra')?.value||'',
    nssfNo: document.getElementById('emp_nssf_no')?.value||'',
    email: document.getElementById('emp_email')?.value||'',
    phone: document.getElementById('emp_phone')?.value||'',
    dateHired: document.getElementById('emp_hired')?.value||'',
    department: document.getElementById('emp_dept')?.value||'General',
    designation: document.getElementById('emp_desig')?.value||'',
    basicSalary: basic,
    empType: document.getElementById('emp_type')?.value||'primary',
    status: document.getElementById('emp_status')?.value||'active',
    allowances,
    deductions,
  };

  if (id) {
    const idx = state.employees.findIndex(e=>e.id===id);
    if (idx>=0) state.employees[idx] = emp;
  } else {
    state.employees.push(emp);
  }
  closeModal();
  showToast(`✅ Employee ${fn} ${ln} ${id?'updated':'added'} successfully`);
}

function saveLoan() {
  const empId = document.getElementById('loan_emp')?.value;
  const loanType = document.getElementById('loan_type')?.value;
  const amount = parseFloat(document.getElementById('loan_amount')?.value||0);
  const months = parseInt(document.getElementById('loan_months')?.value||1);
  const startMonth = parseInt(document.getElementById('loan_month')?.value);
  const startYear = parseInt(document.getElementById('loan_year')?.value);
  if (!empId || !amount || !months) { showToast('❌ Fill all required fields'); return; }
  const emp = state.employees.find(e=>e.id===empId);
  const monthly = Math.ceil(amount/months);
  state.loans.push({
    id:'L'+uid(),
    employeeId:empId,
    employeeName:`${emp.firstName} ${emp.lastName}`,
    loanType,amount,balance:amount,
    monthlyRepayment:monthly,
    startMonth,startYear,
    status:'active'
  });
  // Add deduction to employee
  const empIdx = state.employees.findIndex(e=>e.id===empId);
  if (empIdx>=0) {
    state.employees[empIdx].deductions = state.employees[empIdx].deductions || [];
    state.employees[empIdx].deductions.push({name:loanType+' Repayment',amount:monthly});
  }
  closeModal();
  showToast('✅ Loan added and auto-deduction scheduled');
}

function downloadP10CSV() {
  const pr = currentPayroll();
  const headers = ['PIN','Employee Name','Gross Pay','Type','Housing Benefit','Benefits in Kind','Total Cash Pay','Owner Occ Interest','Personal Relief','Insurance Relief','Disability Exempt','Investment Deduct','Mortgage Relief','PAYE Calc','SHIF','AHL','NSSF Employee','Pension Contrib','Taxable Pay','PAYE Deducted','Monthly Reliefs','Personal Relief Applied','Insurance Relief Applied','Disability Applied','PAYE Payable','Net Pay'];
  const rows = pr.map(r=>{
    const isPrimary = r.empType==='primary';
    const colO = isPrimary?r.shif:0;
    const colP = isPrimary?r.ahl:0;
    const colT = isPrimary?0:r.grossSalary*0.30;
    const colV = isPrimary?PERSONAL_RELIEF:2400;
    const colY = isPrimary?r.paye:r.grossSalary*0.30;
    return [r.kraPin,r.employeeName,r.grossSalary,r.empType,0,0,r.grossSalary,0,isPrimary?PERSONAL_RELIEF:0,0,0,0,0,(r.paye+(isPrimary?PERSONAL_RELIEF:0)).toFixed(2),colO,colP,r.nssf,0,r.taxableIncome,colT,0,colV,0,0,colY,r.netPay].join(',');
  });
  const csv = [headers.join(','),...rows].join('\n');
  const blob = new Blob([csv],{type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href=url;
  a.download=`P10_Simplified_${MONTHS[state.currentPeriod.month-1]}_${state.currentPeriod.year}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  showToast('✅ P10 CSV downloaded — ready for KRA iTax upload');
}

  const a=document.createElement('a');
  a.href=url;a.download=`SHA_Return_${MONTHS[state.currentPeriod.month-1]}_${state.currentPeriod.year}.csv`;
  a.click();URL.revokeObjectURL(url);
  showToast('✅ SHA/SHIF Return downloaded');
}

function downloadP9PDF(empId) { showToast('📄 Generating P9 Form PDF...'); }
function emailP9(empId) {
  const emp=state.employees.find(e=>e.id===empId);
  showToast(`📧 P9 Form emailed to ${emp?.email||'employee'}`);
}

function viewLoanSchedule(loanId) {
  const loan=state.loans.find(l=>l.id===loanId);
  if(!loan) return;
  let html=`<div class="modal-overlay" onclick="if(event.target===this)this.remove()"><div class="modal">
    <div class="modal-header"><div class="modal-title">Loan Schedule — ${loan.employeeName}</div><button class="modal-close" onclick="this.closest('.modal-overlay').remove()">✕</button></div>
    <div class="modal-body">
    <div class="info-grid" style="margin-bottom:16px">
      <div class="info-item"><label>Loan Type</label><span>${loan.loanType}</span></div>
      <div class="info-item"><label>Total Amount</label><span>${fmt(loan.amount)}</span></div>
      <div class="info-item"><label>Monthly Repayment</label><span>${fmt(loan.monthlyRepayment)}</span></div>
      <div class="info-item"><label>Outstanding Balance</label><span style="color:var(--red)">${fmt(loan.balance)}</span></div>
    </div>
    <table><thead><tr><th>#</th><th>Month</th><th>Repayment</th><th>Balance</th><th>Status</th></tr></thead><tbody>`;
  let balance=loan.amount;
  const periods=Math.ceil(loan.amount/loan.monthlyRepayment);
  for(let i=0;i<periods;i++){
    let m=loan.startMonth+i;
    let y=loan.startYear;
    while(m>12){m-=12;y++;}
    const rep=Math.min(loan.monthlyRepayment,balance);
    balance=Math.max(0,balance-rep);
    const past=y<state.currentPeriod.year||(y===state.currentPeriod.year&&m<=state.currentPeriod.month);
    html+=`<tr><td>${i+1}</td><td>${MONTHS[m-1]} ${y}</td><td>${fmt(rep)}</td><td>${fmt(balance)}</td>
      <td><span class="badge ${past?'green':'gray'}">${past?'Paid':'Pending'}</span></td></tr>`;
  }
  html+=`</tbody></table></div></div></div>`;
  document.body.insertAdjacentHTML('beforeend',html);
}

function renderP9Preview() {
  // called from select onchange
  setTimeout(()=>{
    const fn = window.renderP9Preview;
    if(fn) fn();
  },0);
}

// ── Bootstrap ──────────────────────────────────────────────
render();
// Re-expose renderP9Preview for inline call
window.renderP9Preview = function() {
  const empId = document.getElementById('p9EmpSelect')?.value;
  const preview = document.getElementById('p9Preview');
  if (!preview) return;
  if (!empId) { preview.innerHTML=''; return; }
  const emp = state.employees.find(e=>e.id===empId);
  if (!emp) return;
  const rows = Array.from({length:12},(_,i)=>computePayroll(emp,i+1,state.currentPeriod.year));
  const totGross=rows.reduce((s,r)=>s+r.grossSalary,0);
  const totBasic=rows.reduce((s,r)=>s+r.basicSalary,0);
  const totPAYE=rows.reduce((s,r)=>s+r.paye,0);
  const totNSSF=rows.reduce((s,r)=>s+r.nssf,0);
  preview.innerHTML=`<div class="card mt-16">
    <div class="card-header">
      <div><div class="card-title">P9 Form — ${emp.firstName} ${emp.lastName}</div><div style="font-size:12px;color:var(--gray-500)">Year: ${state.currentPeriod.year}</div></div>
      <div class="btn-group">
        <button class="btn btn-outline btn-sm" onclick="exportP9Excel()">📊 Excel</button>
        <button class="btn btn-primary btn-sm" onclick="downloadP9PDF('${empId}')">📄 PDF</button>
        <button class="btn btn-outline btn-sm" onclick="emailP9('${empId}')">📧 Email</button>
      </div>
    </div>
    <div class="card-body">
      <div class="form-grid-3">
        ${[['Name',`${emp.firstName} ${emp.lastName}`],['ID',emp.id],['KRA PIN',emp.kraPin],['ID Number',emp.idNumber],['Designation',emp.designation],['Tax Year',state.currentPeriod.year]].map(([l,v])=>`<div class="info-item"><label>${l}</label><span>${v||'—'}</span></div>`).join('')}
      </div>
    </div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>Month</th><th>Basic</th><th>Allowances</th><th>Gross</th><th>NSSF</th><th>Taxable</th><th>Tax</th><th>Relief</th><th>PAYE</th></tr></thead>
        <tbody>${rows.map((r,i)=>`<tr>
          <td>${MONTHS[i]}</td><td>${fmtN(r.basicSalary)}</td><td>${fmtN(r.allowances)}</td>
          <td>${fmtN(r.grossSalary)}</td><td>${fmtN(r.nssf)}</td><td>${fmtN(r.taxableIncome)}</td>
          <td>${fmtN(r.paye+PERSONAL_RELIEF)}</td><td>${fmtN(PERSONAL_RELIEF)}</td><td><strong>${fmtN(r.paye)}</strong></td>
        </tr>`).join('')}</tbody>
        <tfoot><tr class="tfoot-row">
          <td><strong>TOTALS</strong></td><td>${fmtN(totBasic)}</td><td>${fmtN(totGross-totBasic)}</td>
          <td><strong>${fmtN(totGross)}</strong></td><td>${fmtN(totNSSF)}</td><td>${fmtN(totGross-totNSSF)}</td>
          <td>${fmtN(totPAYE+PERSONAL_RELIEF*12)}</td><td>${fmtN(PERSONAL_RELIEF*12)}</td><td><strong>${fmtN(totPAYE)}</strong></td>
        </tr></tfoot>
      </table>
    </div>
  </div>`;
};
</script>
